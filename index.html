<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="陈屹凌的个人网站：大气科学在读 · AI 应用探索者，记录 AI 辅助创作与开发中的作品和迭代。">
<meta name="theme-color" content="#FFF9F2">
<link rel="preload" as="image" href="hero-bg.webp">
<title>陈屹凌 · AI 应用探索者</title>
<!-- 性能说明：全站零外部依赖（CSS/JS/图标全部内联），图片统一 WebP + 懒加载 -->
<style>
/* ============ 个性创意风 · 暖色调主题（配合 Tailwind 使用） ============ */
:root{
  --ink:#3D3229;
  --sub:#8A7A6D;
  --coral:#FF7E5F;
  --peach:#FFB88C;
  --yellow:#FFC94D;
  --green:#7FB685;
}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:#FFF9F2;color:var(--ink);line-height:1.75;
}
a{color:inherit;text-decoration:none}

/* ---------- 全局滚动进度条（cyan → emerald 渐变，按需求） ---------- */
#progress{
  position:fixed;top:0;left:0;height:4px;width:0%;z-index:200;
  background:linear-gradient(90deg,#22d3ee,#34d399);
  transition:width .08s linear;
}

/* ---------- 导航 ---------- */
nav{
  position:fixed;top:4px;left:0;right:0;z-index:100;
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 6vw;
  background:rgba(255,249,242,.85);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,126,95,.15);
}
nav .logo{font-weight:800;font-size:1.15rem;color:var(--coral)}
nav .links{display:flex;gap:22px;font-size:.92rem;flex-wrap:wrap}
nav .links a{color:var(--sub);transition:.25s}
nav .links a:hover{color:var(--coral)}

/* ---------- 首屏 ---------- */
.hero{
  position:relative;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  gap:5vw;padding:120px 6vw 80px;flex-wrap:wrap;text-align:left;
  background:url("hero-bg.webp") center/cover no-repeat;
}
/* 深色渐变蒙版：压暗背景、突出内容 */
.hero::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(125deg, rgba(40,28,22,.34) 0%, rgba(40,28,22,.14) 45%, rgba(40,28,22,.26) 100%);
}
.hero > *{position:relative;z-index:1}

/* 左侧个人信息卡（毛玻璃） */
.hero .info-card{
  background:rgba(255,255,255,.14);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.28);
  border-radius:28px;padding:38px 36px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  max-width:420px;flex:1 1 320px;transition:transform .4s;
}
.hero .info-card:hover{transform:translateY(-8px)}
/* 名字 + 头像同行 */
.name-row{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:14px}
.hero .avatar{
  width:148px;height:148px;border-radius:28px;object-fit:cover;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  border:3px solid #fff;flex-shrink:0;transform:rotate(3deg);
}
.hero h1{
  font-size:clamp(2rem,4.5vw,2.8rem);letter-spacing:.04em;line-height:1.1;
  color:#FFF3E0;font-weight:800;text-shadow:0 2px 14px rgba(0,0,0,.35);
}
.hero .tag{
  display:inline-block;margin:14px 0 6px;padding:6px 18px;border-radius:999px;
  background:linear-gradient(90deg,var(--coral),var(--peach));color:#fff;
  font-weight:700;font-size:1rem;
}
.hero .sub{color:rgba(255,243,224,.92);font-size:1rem;margin-bottom:16px}

/* 打字机（呼吸闪烁光标，带金色「」边框装饰） */
.typeline{
  height:1.9em;font-size:1.1rem;font-weight:700;color:#FFDD8A;
  text-shadow:0 1px 10px rgba(0,0,0,.3);margin-top:34px;
}
.typeline::before{content:"「 ";color:#FFC94D}
.typeline::after{content:" 」";color:#FFC94D}
.typeline .cursor{
  display:inline-block;width:2px;height:1.15em;margin-left:3px;
  background:#FFDD8A;vertical-align:-2px;
  animation:blink 1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}

.btn{
  padding:11px 24px;border-radius:999px;font-weight:700;font-size:.92rem;
  transition:.25s;display:inline-flex;align-items:center;gap:8px;
  cursor:pointer;border:none;
}
.btn.primary{background:#fff;color:var(--ink)}
.btn.primary:hover{background:var(--coral);color:#fff;transform:translateY(-3px)}
.btn.ghost{border:2px solid rgba(255,255,255,.8);color:#fff;background:transparent}
.btn.ghost:hover{background:#fff;color:var(--ink);transform:translateY(-3px)}
.quote-line{
  margin-top:26px;font-size:1.1rem;font-weight:600;color:#FFDD8A;
  text-shadow:0 1px 10px rgba(0,0,0,.3);min-height:1.8em;
}
.quote-line::before{content:"「 "}.quote-line::after{content:" 」"}

/* 右侧网站列表卡片格：两行三列，行内等高 */
.nav-grid{flex:1 1 520px;max-width:600px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:16px}
/* 通用卡片：统一玻璃底 + 左对齐内容结构 */
.nav-card{
  position:relative;display:flex;flex-direction:column;
  padding:24px 22px;border-radius:20px;color:#fff;text-align:left;
  background:rgba(255,255,255,.14);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.28);
  box-shadow:0 12px 34px rgba(0,0,0,.22);
  transition:transform .3s, border-color .3s, box-shadow .3s, background .3s;
}
.nav-card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.5)}
/* 键盘焦点清晰可见 */
.nav-card:focus-visible{outline:2px solid #FFDD8A;outline-offset:3px}
/* 顶部：线性图标 + 右上角箭头 */
.nc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:auto}
.nc-ico{width:26px;height:26px;color:#FFE1A6}
.nc-ico svg{width:100%;height:100%}
.nc-arrow{width:18px;height:18px;color:rgba(255,255,255,.7)}
.nc-arrow svg{width:100%;height:100%}
/* 中文标题 → 英文副标题 → 简短说明 */
.nav-name{display:block;font-weight:700;font-size:1.04rem;margin-top:16px;line-height:1.4}
.nav-en{display:block;margin-top:5px;font-size:.72rem;letter-spacing:.12em;font-weight:600;color:#FFE1A6;text-transform:uppercase}
.nav-desc{display:block;margin-top:8px;font-size:.8rem;line-height:1.55;color:rgba(255,243,224,.88)}

/* 重点卡 1：AI 实战（权重最高：暖粉边缘光 + 内高光） */
.nav-card.hot{
  background:rgba(255,255,255,.24);
  border:1px solid rgba(255,183,140,.6);
  box-shadow:0 0 0 1px rgba(255,183,140,.22), 0 14px 40px rgba(255,126,95,.35), inset 0 1px 0 rgba(255,255,255,.4);
}
.nav-card.hot:hover{border-color:rgba(255,205,170,.85)}
/* 重点卡 2：PPT 放映室（同组但略弱一档） */
.nav-card.warm{
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,183,140,.38);
  box-shadow:0 12px 34px rgba(255,126,95,.25), inset 0 1px 0 rgba(255,255,255,.3);
}
.nav-card.warm:hover{border-color:rgba(255,205,170,.6)}
/* 预告卡：安静底色 + 细实线边框，无悬浮动效、不可点击 */
.nav-card.soon{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.18);
  cursor:default;
}
.nav-card.soon:hover{transform:none;border-color:rgba(255,255,255,.18)}
.nav-card.soon .nc-ico{opacity:.55}

/* 减少动态效果偏好：取消位移动画 */
@media (prefers-reduced-motion: reduce){
  .nav-card:hover{transform:none}
}

/* ---------- 通用区块 ---------- */
section{max-width:1060px;margin:0 auto;padding:90px 6vw 10px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:38px}
.sec-head .num{font-size:2.4rem;font-weight:800;color:transparent;-webkit-text-stroke:1.6px var(--coral);font-family:Georgia,serif}
.sec-head h2{font-size:1.7rem;letter-spacing:.06em}
.sec-head .line{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,126,95,.4),transparent)}

/* 关于我：四段平铺（开场 / 事实 / 实践方式 / 格言） */
.about-block{margin-bottom:34px}
.about-block:last-child{margin-bottom:0}
/* 开场：姓名小标题 + 定位 + 正文 */
.a-name{font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:800;color:var(--ink);line-height:1.2}
.a-role{margin-top:8px;font-weight:700;font-size:1.02rem;letter-spacing:.04em;color:var(--coral)}
.a-intro{margin-top:14px;color:var(--sub);font-size:1rem;line-height:1.85;max-width:34em}

/* 事实栏：中文标签，横排，自然换行 */
.fact-strip{
  display:flex;gap:0;flex-wrap:wrap;
  background:#fff;border-radius:18px;
  box-shadow:0 8px 28px rgba(255,126,95,.12);overflow:hidden;
}
.fact-item{flex:1 1 180px;padding:16px 22px;border-left:3px solid rgba(255,126,95,.25)}
.fact-item:first-child{border-left:none}
.fact-item .label{font-size:.8rem;font-weight:700;letter-spacing:.1em;color:var(--coral)}
.fact-item .value{margin-top:4px;font-weight:600;font-size:.96rem;color:var(--ink);line-height:1.5}

/* 我的实践方式：三张轻量卡片，仅此处使用轻量编号 */
.practice-title{font-size:1.05rem;font-weight:700;margin:0 0 16px}
.practice-grid{display:flex;gap:14px;flex-wrap:wrap}
.practice-card{
  flex:1 1 200px;background:#fff;border-radius:18px;padding:20px 18px;
  box-shadow:0 8px 28px rgba(255,126,95,.12);border-top:4px solid var(--yellow);
}
.practice-card:nth-child(1){border-top-color:var(--peach)}
.practice-card:nth-child(3){border-top-color:var(--green)}
.p-num{
  display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:50%;font-size:.75rem;font-weight:800;
  background:rgba(255,126,95,.12);color:var(--coral);
}
.practice-card h4{margin-top:10px;font-size:1rem;font-weight:700}
.practice-card p{margin-top:6px;font-size:.88rem;color:var(--sub);line-height:1.65}

/* 格言：细线引文，字号适中 */
.a-quote{
  font-size:1.12rem;font-weight:700;color:var(--ink);line-height:1.7;
  padding-left:16px;border-left:3px solid var(--peach);max-width:30em;
}
.a-quote::before{content:"「 "}.a-quote::after{content:" 」"}

/* 技能卡片 */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.skill-card{
  background:#fff;border-radius:20px;padding:26px;
  box-shadow:0 8px 28px rgba(255,126,95,.12);transition:.3s;position:relative;overflow:hidden;
}
.skill-card::after{
  content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;
  border-radius:50%;background:rgba(255,201,77,.18);
}
.skill-card:hover{transform:translateY(-6px)}
.skill-card .ico{font-size:1.8rem}
.skill-card h3{font-size:1.05rem;margin:8px 0}
.skill-card p{color:var(--sub);font-size:.92rem;margin-bottom:12px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag-chip{
  font-size:.78rem;padding:3px 12px;border-radius:999px;
  background:rgba(255,126,95,.12);color:var(--coral);font-weight:600;
}

/* 作品卡片：极简列表风（描边编号 + 英文标题 + 一行短注 + 日期） */
.work-card{
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:30px;
  background:#fff;border-radius:20px;
  padding:30px 34px;margin-bottom:16px;
  box-shadow:0 8px 28px rgba(255,126,95,.12);
  transition:transform .3s, box-shadow .3s;
}
/* 悬停：白色线性渐变从板块中心快速蔓延覆盖 */
.work-card::before{
  content:"";position:absolute;inset:0;z-index:0;
  background:linear-gradient(120deg,#ffffff,#FFF3E8);
  clip-path:circle(0% at 50% 50%);
  transition:clip-path .38s ease;
}
.work-card:hover::before{clip-path:circle(150% at 50% 50%)}
.work-card>*{position:relative;z-index:1}
.work-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(255,126,95,.22)}
/* 悬停时文字反色 */
.work-card:hover .work-en{color:var(--ink)}
.work-card:hover .work-short{color:#6B5B4E}
.work-card:hover .work-num{background:linear-gradient(135deg,var(--ink),#5A4A3E);box-shadow:0 8px 18px rgba(61,50,41,.3)}

/* 项目标号 01/02/03（实心色块样式，与主标题的描边数字区分开） */
.work-num{
  flex-shrink:0;
  width:52px;height:52px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.15rem;font-weight:800;letter-spacing:.02em;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  color:#fff;background:linear-gradient(135deg,var(--coral),var(--peach));
  box-shadow:0 8px 18px rgba(255,126,95,.3);
  transition:box-shadow .3s;
  line-height:1;
}
/* 英文主标题 */
.work-body{flex:1;min-width:0}
.work-en{
  font-size:clamp(1.05rem,2.2vw,1.45rem);font-weight:800;letter-spacing:.03em;
  color:var(--ink);line-height:1.3;
}
/* 中文辅助标题（紧接英文标题，清晰可读） */
.work-cn{margin-top:4px;font-size:1rem;font-weight:700;color:var(--ink);line-height:1.4}
/* 简短说明（降一层，保持可读） */
.work-short{margin-top:5px;color:var(--sub);font-size:.9rem;line-height:1.6}
/* 状态文字（只显示一次） */
.work-status-text{
  display:inline-block;margin-left:10px;padding:1px 10px;border-radius:999px;
  font-size:.74rem;font-weight:700;letter-spacing:.06em;
  background:rgba(255,126,95,.14);color:var(--coral);vertical-align:1px;
}
/* 右侧日期 */
.work-date{
  flex-shrink:0;color:var(--sub);font-size:.88rem;font-weight:600;letter-spacing:.12em;
}

/* 悬停时旋转弹出的预览图框（跟随鼠标） */
.work-float{
  position:fixed;z-index:150;width:230px;pointer-events:none;
  opacity:0;transform:scale(.5) rotate(-14deg);
}
.work-float.show{opacity:1;animation:floatPop .38s cubic-bezier(.2,.9,.3,1.35) forwards}
@keyframes floatPop{
  from{transform:scale(.5) rotate(-14deg)}
  to{transform:scale(1) rotate(4deg)}
}
.work-float .frame{
  width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;
  border:3px solid #fff;box-shadow:0 20px 45px rgba(0,0,0,.32);
  background:#3A3129;display:flex;align-items:center;justify-content:center;
}
.work-float .frame img{width:100%;height:100%;object-fit:cover;display:block}
.work-float .frame .ph{
  color:#FFDD8A;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-align:center;padding:8px;
}
.work-float .cap{
  margin-top:8px;text-align:center;font-size:.72rem;font-weight:700;letter-spacing:.1em;
  color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.45);text-transform:uppercase;
}

/* 点击作品查看大图（灯箱） */
.lightbox{
  position:fixed;inset:0;z-index:400;
  background:rgba(28,20,16,.9);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s;
  cursor:zoom-out;padding:4vmin;
}
.lightbox.show{opacity:1;pointer-events:auto}
.lightbox img{
  max-width:min(1100px,92vw);max-height:88vh;border-radius:14px;
  box-shadow:0 30px 80px rgba(0,0,0,.5);border:3px solid rgba(255,255,255,.9);
  transform:scale(.92);transition:transform .3s cubic-bezier(.2,.8,.3,1.2);
}
.lightbox.show img{transform:scale(1)}
.lightbox .lb-cap{
  position:absolute;bottom:4vh;left:50%;transform:translateX(-50%);
  color:#FFDD8A;font-size:.85rem;font-weight:700;letter-spacing:.12em;
}
.work-badge{
  flex-shrink:0;width:64px;height:64px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;font-size:1.8rem;
  background:linear-gradient(135deg,var(--peach),var(--yellow));
}
.work-card.making .work-badge{background:linear-gradient(135deg,var(--coral),var(--peach))}
.work-card h3{font-size:1.15rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.work-status{font-size:.72rem;font-weight:700;padding:2px 10px;border-radius:999px}
.work-status.making{background:var(--coral);color:#fff;animation:pulse 1.6s infinite}
.work-status.done{background:var(--green);color:#fff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.work-card p{color:var(--sub);font-size:.94rem;margin-top:6px}

/* 荣誉时间线 */
.timeline{position:relative;padding-left:34px}
.timeline::before{
  content:"";position:absolute;left:10px;top:6px;bottom:6px;width:3px;
  background:linear-gradient(180deg,var(--coral),var(--yellow),var(--green));border-radius:3px;
}
.tl-item{position:relative;margin-bottom:26px}
.tl-item::before{
  content:"";position:absolute;left:-31px;top:8px;width:15px;height:15px;
  border-radius:50%;background:#fff;border:4px solid var(--coral);
}
.tl-item:nth-child(2)::before{border-color:var(--peach)}
.tl-item:nth-child(3)::before{border-color:var(--yellow)}
.tl-item:nth-child(4)::before{border-color:var(--green)}
.tl-item .year{font-size:.85rem;font-weight:700;color:var(--coral)}
.tl-item .title{font-size:1.02rem;font-weight:600}

/* 书单卡片 */
.books-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.book-card{
  background:#fff;border-radius:20px;padding:24px;
  box-shadow:0 8px 28px rgba(255,126,95,.12);border-left:5px solid var(--yellow);transition:.3s;
}
.book-card:hover{transform:translateY(-5px) rotate(-1deg)}
.book-card h3{font-size:1.05rem;margin-bottom:6px}
.book-card p{color:var(--sub);font-size:.92rem;font-style:italic}

/* PPT 放映室：封面流转盘（cover flow 轮播） */
.deck-wrap{max-width:820px;margin:0 auto}
.deck-caption{text-align:center;margin-bottom:18px}
.deck-caption .deck-name{
  display:inline-block;padding:5px 18px;border-radius:999px;font-size:.85rem;font-weight:700;
  background:rgba(255,126,95,.12);color:var(--coral);letter-spacing:.08em;
}
.deck-caption .deck-title{color:var(--sub);font-size:.9rem;margin-top:8px}

.deck{
  position:relative;height:min(400px,52vw);
  perspective:1400px;            /* 3D 纵深 */
  user-select:none;
}
.deck-slide{
  position:absolute;top:50%;left:50%;
  width:min(560px,72vw);aspect-ratio:16/9;
  margin-left:calc(min(560px,72vw) / -2);
  margin-top:calc(min(560px,72vw) * 9 / 16 / -2);
  border-radius:16px;overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,.28);
  border:1px solid rgba(255,126,95,.15);
  transition:transform .55s cubic-bezier(.25,.8,.3,1), opacity .55s, filter .55s;
  cursor:pointer;will-change:transform;
}
.deck-slide img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
/* 中心页 */
.deck-slide.pos0{transform:translateX(0) translateZ(0) scale(1);opacity:1;filter:brightness(1);z-index:5}
/* 左右相邻页：缩小、变暗、探出 */
.deck-slide.posL1{transform:translateX(-58%) translateZ(-160px) scale(.78);opacity:.55;filter:brightness(.55);z-index:3}
.deck-slide.posR1{transform:translateX(58%)  translateZ(-160px) scale(.78);opacity:.55;filter:brightness(.55);z-index:3}
/* 更远页：藏到两侧 */
.deck-slide.posL2{transform:translateX(-96%) translateZ(-300px) scale(.6);opacity:0;filter:brightness(.4);z-index:1;pointer-events:none}
.deck-slide.posR2{transform:translateX(96%)  translateZ(-300px) scale(.6);opacity:0;filter:brightness(.4);z-index:1;pointer-events:none}

/* 左右翻页按钮 */
.deck-nav{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:22px}
.deck-btn{

/* ---------- 滚动渐入动画（降级：JS 运行时才加 .anim，脚本失败时元素默认完全不透明，绝不白屏） ---------- */
.anim{opacity:0;transform:translateY(34px)}
.anim.in{
  opacity:1;transform:none;
  transition:opacity .8s cubic-bezier(.2,.7,.3,1), transform .8s cubic-bezier(.2,.7,.3,1);
}
/* 同组卡片 / 步骤按顺序错峰（stagger） */
.anim.in{transition-delay:var(--d,0s)}

/* ---------- 彩带粒子画布 ---------- */
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:300}

/* 关于我：四段平铺渲染（数据全部来自 data.js 的 about） */

document.getElementById("worksList").innerHTML = DATA.works.map((w, i) => {
  const num = String(i + 1).padStart(2, "0");

document.getElementById("booksGrid").innerHTML = DATA.books.map(b =>
  `<div class="book-card"><h3>📖 ${b.title}</h3><p>${b.note}</p></div>`).join("");
/* ================= PPT 放映室：封面流转盘 ================= */
(function deck(){
  // 把各 PPT 的 slides 拉平成一条流，并记录所属作品
  const slides = [];
  (DATA.ppt || []).forEach(d => d.slides.forEach(s => slides.push({ src: s, deck: d.deck, title: d.title, desc: d.desc })));
  const deckEl = document.getElementById("deck");
  if (!slides.length || !deckEl) return;
  let cur = 0;

  deckEl.innerHTML = slides.map((s, i) => `<div class="deck-slide" data-i="${i}"><img src="${s.src}" alt="${s.title}" loading="lazy" decoding="async" draggable="false"></div>`).join("");
  document.getElementById("deckDots").innerHTML = slides.map((_, i) => `<i data-i="${i}"></i>`).join("");
  const slideEls = Array.from(deckEl.children);
  const dotEls = Array.from(document.getElementById("deckDots").children);

  function render(){
    slideEls.forEach((el, i) => {
      let cls;
      if (i === cur) cls = "pos0";
      else if (i === cur - 1) cls = "posL1";
      else if (i === cur + 1) cls = "posR1";
      else if (i < cur - 1) cls = "posL2";
      else cls = "posR2";
      el.className = "deck-slide " + cls;
    });
    dotEls.forEach((d, i) => d.classList.toggle("on", i === cur));
    document.getElementById("deckName").textContent = slides[cur].deck;
    document.getElementById("deckTitle").textContent = slides[cur].title + " · " + slides[cur].desc;
  }
  function go(i){ cur = Math.min(slides.length - 1, Math.max(0, i)); render(); }

  document.getElementById("deckPrev").addEventListener("click", () => go(cur - 1));
  document.getElementById("deckNext").addEventListener("click", () => go(cur + 1));
  dotEls.forEach(d => d.addEventListener("click", () => go(+d.dataset.i)));
  // 点击两侧探出的页面直接跳转到该页
  slideEls.forEach(el => el.addEventListener("click", () => go(+el.dataset.i)));
  render();
})();

/* ================= 1. 全局滚动进度条（cyan → emerald 渐变） ================= */
const progressEl = document.getElementById("progress");
function updateProgress(){
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  progressEl.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + "%";
}
window.addEventListener("scroll", updateProgress, { passive: true });
updateProgress();

/* ================= 2. 打字机叙事（纯原生 JS，呼吸光标见 CSS） ================= */
(function typewriter(){
  const words = DATA.keywords || [];
  const el = document.getElementById("typed");
  if (!words.length || !el) return;
  let wi = 0, ci = 0, deleting = false;
  function tick(){
    const word = words[wi % words.length];
    if (!deleting) {
      ci++;
      el.textContent = word.slice(0, ci);
      if (ci === word.length) { deleting = true; return setTimeout(tick, 1800); } // 停留 1.8s
      setTimeout(tick, 110);
    } else {
      ci--;
      el.textContent = word.slice(0, ci);
      if (ci === 0) { deleting = false; wi++; return setTimeout(tick, 400); }
      setTimeout(tick, 55);
    }
  }
  tick();
})();

/* ================= 3. 金句轮播（元素已移除，保留空实现防报错） ================= */
(function quotes(){
  const qs = DATA.quotes || [];
  const el = document.getElementById("quote");
  if (!qs.length || !el) return;
  let i = 0;
  el.textContent = qs[0];
  setInterval(() => { i = (i + 1) % qs.length; el.textContent = qs[i]; }, 4000);
})();

/* ================= 4. 滚动渐入（IntersectionObserver + stagger，含降级） ================= */
/* 降级方案：只有 JS 执行到这里才会加 .anim；脚本失败时元素保持默认 opacity:1，绝不白屏 */
(function reveal(){
  // 同组（stagger 容器）内的卡片设置错峰延迟
  document.querySelectorAll(".stagger").forEach(group => {
    Array.from(group.children).forEach((child, i) => {
      child.style.setProperty("--d", (i * 0.12) + "s");
      child.classList.add("anim");
    });
  });
  // 各区块标题、作品卡片也加入渐入
  document.querySelectorAll(".sec-head, .work-card").forEach(el => el.classList.add("anim"));

  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
  document.querySelectorAll(".anim").forEach(el => io.observe(el));
})();

/* ================= 4.5（已移除：关于我主轴生长动画随五步结构一并取消） ================= */

/* ================= 5. 彩带粒子（原生 Canvas 实现，60fps，只动合成层不重排） ================= */
const cvs = document.getElementById("confetti-canvas");
const ctx = cvs.getContext("2d");
let particles = [];
let rafId = null;

function resizeCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2); // 限制 DPR 保证帧率
  cvs.width = innerWidth * dpr;
  cvs.height = innerHeight * dpr;
  cvs.style.width = innerWidth + "px";
  cvs.style.height = innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const CONFETTI_COLORS = ["#FF7E5F","#FFB88C","#FFC94D","#7FB685","#22d3ee","#FFDD8A"];
function burst(x, y, count){
  for (let i = 0; i < count; i++){
    const angle = Math.random() * Math.PI * 2;
    const speed = 4 + Math.random() * 7;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      w: 5 + Math.random() * 6,
      h: 8 + Math.random() * 8,
      color: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0],
      rot: Math.random() * Math.PI,
      vr: (Math.random() - .5) * .3,
      life: 1
    });
  }
  if (!rafId) rafId = requestAnimationFrame(draw);
}
function draw(){
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  particles = particles.filter(pt => pt.life > 0);
  for (const pt of particles){
    pt.vy += 0.22;            // 重力
    pt.vx *= 0.99;            // 空气阻力
    pt.x += pt.vx; pt.y += pt.vy;
    pt.rot += pt.vr;
    pt.life -= 0.012;
    ctx.save();
    ctx.translate(pt.x, pt.y);
    ctx.rotate(pt.rot);
    ctx.globalAlpha = Math.max(pt.life, 0);
    ctx.fillStyle = pt.color;
    // 高度随旋转变化，模拟纸屑翻转
    ctx.fillRect(-pt.w / 2, -pt.h / 2, pt.w, pt.h * Math.abs(Math.sin(pt.rot * 2)) + 2);
    ctx.restore();
  }
  rafId = particles.length ? requestAnimationFrame(draw) : null;
}

/* ================= 7.5 作品卡片悬停特效：白色蔓延 + 鼠标处旋转弹出预览图 + 点击看大图 ================= */
(function workHover(){
  // 创建悬浮图框（一个共用，跟随鼠标移动）
  const float = document.createElement("div");
  float.className = "work-float";
  float.innerHTML = `
    <div class="frame">
      <img alt="">
      <div class="ph"></div>
    </div>
    <div class="cap"></div>`;
  document.body.appendChild(float);
  const img = float.querySelector("img");
  const ph  = float.querySelector(".ph");
  const cap = float.querySelector(".cap");
  // 图片加载失败时显示空画框占位（提示文件名）
  img.addEventListener("error", () => { img.style.display = "none"; });
  img.addEventListener("load",  () => { img.style.display = "block"; ph.style.display = "none"; });

  let visible = false;

  function showFloat(card, evt){
    const src = card.getAttribute("data-img") || "";
    const fileName = src.split("/").pop() || "AI1.png";
    if (img.getAttribute("src") !== src) {
      img.setAttribute("src", src);
      ph.style.display = "block";
      ph.textContent = fileName + "（待放入 assets 文件夹）";
    }
    cap.textContent = fileName;
    moveFloat(evt);
    if (!visible) { float.classList.add("show"); visible = true; }
  }
  function moveFloat(evt){
    const w = 230, h = 200; // 图框估算尺寸
    let x = evt.clientX + 26;
    let y = evt.clientY - h / 2;
    // 防止超出视口
    if (x + w > innerWidth - 12)  x = evt.clientX - w - 26;
    if (y < 12)  y = 12;
    if (y + h > innerHeight - 12) y = innerHeight - h - 12;
    float.style.left = x + "px";
    float.style.top  = y + "px";
  }
  function hideFloat(){
    float.classList.remove("show");
    visible = false;
  }

  document.querySelectorAll(".work-card").forEach(card => {
    card.addEventListener("mouseenter", evt => showFloat(card, evt));
    card.addEventListener("mousemove",  evt => moveFloat(evt));
    card.addEventListener("mouseleave", hideFloat);
  });

  /* 点击作品卡片 → 打开大图灯箱 */
  const lightbox = document.createElement("div");
  lightbox.className = "lightbox";
  lightbox.innerHTML = `<img alt="" decoding="async"><div class="lb-cap"></div>`;
  document.body.appendChild(lightbox);
  const lbImg = lightbox.querySelector("img");
  const lbCap = lightbox.querySelector(".lb-cap");
  function openLightbox(card){
    const src = card.getAttribute("data-img");
    if (!src) return;
    lbImg.src = src;
    lbCap.textContent = card.querySelector(".work-en").textContent + " · 点击任意处关闭";
    lightbox.classList.add("show");
  }
  lightbox.addEventListener("click", () => lightbox.classList.remove("show"));
  window.addEventListener("keydown", e => { if (e.key === "Escape") lightbox.classList.remove("show"); });
  document.querySelectorAll(".work-card").forEach(card => {
    card.addEventListener("click", () => openLightbox(card));
  });
})();

/* ================= 6. 气泡反馈 ================= */
const toastEl = document.getElementById("toast");
let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

/* ================= 7. 按钮交互：复制邮箱 / 打招呼 → 彩带 + 气泡 ================= */
function fireAt(el, evt){
  const rect = el.getBoundingClientRect();
  const x = evt && evt.clientX ? evt.clientX : rect.left + rect.width / 2;
  const y = evt && evt.clientY ? evt.clientY : rect.top + rect.height / 2;
  burst(x, y, 70);
}
["copyBtn","copyBtn2"].forEach(id => {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.addEventListener("click", evt => {
    fireAt(btn, evt);
    // 复制邮箱到剪贴板（带 execCommand 降级）
    const done = () => toast("📋 邮箱已复制：" + p.email);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(p.email).then(done).catch(done);
    } else {
      const ta = document.createElement("textarea");
      ta.value = p.email; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); } catch(e){}
      document.body.removeChild(ta); done();
    }
  });
});
const hiBtn = document.getElementById("hiBtn");
if (hiBtn) hiBtn.addEventListener("click", evt => {
  fireAt(hiBtn, evt);
  toast("👋 你好呀！很高兴认识你，欢迎常来看看～");
});
